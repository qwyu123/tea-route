<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#edefe7">
<title>茶途智配 · 下单</title>
<link rel="stylesheet" href="order.css">
</head>
<body>
<div class="phone">

  <header>
    <div class="mark">
      <div class="dot">茶</div>
      <div>
        <b>茶途智配</b>
        <span>安吉白茶 · 春茶发运下单</span>
      </div>
    </div>
  </header>

  <main>
    <form id="f" autocomplete="off">

      <section class="card">
        <h2>收货信息</h2>
        <label class="field">
          <span class="lb">客户 / 收货人</span>
          <input id="cust" placeholder="如：宋品茶叶 张经理">
        </label>
        <div class="field">
          <span class="lb">收货城市<em>决定走哪条线</em></span>
          <div class="chips" id="cities">
            <button type="button" data-v="杭州">杭州</button>
            <button type="button" data-v="上海">上海</button>
            <button type="button" data-v="北京">北京</button>
            <button type="button" data-v="广州">广州</button>
            <button type="button" data-v="南京">南京</button>
            <button type="button" data-v="苏州">苏州</button>
            <button type="button" data-v="深圳">深圳</button>
            <button type="button" data-v="武汉">武汉</button>
          </div>
          <input id="cityOther" class="mt" placeholder="其他城市，直接填写">
        </div>
      </section>

      <section class="card">
        <h2>货物 <small>按包裹计费</small></h2>
        <div class="field">
          <span class="lb">等级</span>
          <div class="chips" id="grades">
            <button type="button" data-v="精品级">精品级</button>
            <button type="button" data-v="特级">特级</button>
            <button type="button" data-v="一级" class="on">一级</button>
            <button type="button" data-v="二级">二级</button>
          </div>
        </div>
        <label class="field">
          <span class="lb">规格</span>
          <input id="spec" placeholder="如 250g×12听">
        </label>
        <div class="two">
          <div class="field">
            <span class="lb">包裹数</span>
            <div class="stepper">
              <button type="button" id="minus">−</button>
              <b id="qty">4</b>
              <button type="button" id="plus">+</button>
            </div>
          </div>
          <label class="field">
            <span class="lb">总重 kg<em>可不填</em></span>
            <input id="kg" type="number" inputmode="decimal" step="0.1" min="0" placeholder="自动估">
          </label>
        </div>
        <p class="hint">不填重量时按每包 0.6kg 估算，系统会标明这一项是推算值，不冒充实数。</p>
      </section>

      <section class="card">
        <h2>时效与出货点</h2>
        <div class="field">
          <span class="lb">送达要求</span>
          <div class="seg" id="reqs">
            <button type="button" data-v="nextday">次日到<em>贵一些</em></button>
            <button type="button" data-v="std" class="on">常规<em>更省</em></button>
          </div>
        </div>
        <div class="field">
          <span class="lb">取货点</span>
          <div class="chips" id="points">
            <button type="button" data-v="溪龙" class="on">溪龙</button>
            <button type="button" data-v="昆铜">昆铜</button>
            <button type="button" data-v="天荒坪">天荒坪</button>
          </div>
        </div>
        <label class="field">
          <span class="lb">备注</span>
          <input id="note" placeholder="选填，如：怕压、要开票">
        </label>
      </section>

      <div class="bar">
        <div class="sum">
          <span>本单</span>
          <b id="sumline">4 包 · 常规</b>
        </div>
        <button type="submit" class="btn" id="submit">提交订单</button>
      </div>
    </form>

    <section id="done" class="card done no">
      <div class="okmark">✓</div>
      <h3>已提交</h3>
      <p>订单号 <b id="oid"></b></p>
      <p class="muted" id="doneMsg">已同步到主系统订单池</p>
      <div class="hr"></div>
      <div class="lines" id="doneLines"></div>
      <button class="btn ghost" id="again">再下一单</button>
    </section>
  </main>
</div>

<svg width="0" height="0" aria-hidden="true" style="position:absolute">
  <filter id="glass-refract" x="-20%" y="-20%" width="140%" height="140%">
    <feTurbulence type="fractalNoise" baseFrequency="0.009 0.013" numOctaves="2" seed="9" result="noise"/>
    <feDisplacementMap in="SourceGraphic" in2="noise" scale="26" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
</svg>
<div id="toast"></div>
<script src="order.js"></script>
</body>
</html>
